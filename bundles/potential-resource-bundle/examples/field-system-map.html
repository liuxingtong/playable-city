<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PRB · 触媒场域 + 资源场域</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="../lib/xujiahui-osm-boundary.js"></script>
<script src="../lib/ac-dom-aggregate.js"></script>
<script src="../lib/cluster-field-circles.js"></script>
<script src="../lib/catalyst-seam-clusters.js"></script>
<script src="../lib/corridor-bottleneck-routing.js"></script>
<script src="../modules/jenks-classification.js"></script>
<script src="../modules/field-system-data.js"></script>
<script src="../modules/field-system-algorithms.js"></script>
<script src="../modules/field-system-leaflet-render.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Noto+Sans+SC:wght@400;500&display=swap');
  :root { --magenta-bright: #ff4dad; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;font-family:'DM Sans','Noto Sans SC',sans-serif;background:#08080a}
  #map{width:100%;height:100%;z-index:1}
  .leaflet-control-attribution{display:none!important}
  #map-loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#08080a;z-index:2000;color:rgba(255,255,255,0.5);font-size:13px;letter-spacing:2px}
  #map-loading.done{opacity:0;pointer-events:none;transition:opacity 0.35s ease}
  .panel-header{position:fixed;top:0;left:0;right:0;padding:18px 24px;background:linear-gradient(180deg,rgba(8,8,10,0.94),transparent);z-index:1000;pointer-events:none}
  .panel-header h1{font-size:19px;color:#f0f0f0;font-weight:700}
  .panel-header .sub{font-size:11px;color:rgba(255,255,255,0.38);margin-top:4px;max-width:720px;line-height:1.45}
  .map-chip-leaflet-root{background:none!important;border:none!important}
  .map-chip-cyan{
    box-sizing:border-box;max-width:3.4rem;min-width:0;padding:1px 3px;border-radius:2px;
    font-size:7px;font-weight:700;line-height:1.12;text-align:center;white-space:normal;word-break:break-all;
    border:1px solid;background:rgba(0,20,28,0.93);box-shadow:0 1px 4px rgba(0,0,0,0.42);pointer-events:none;
  }
</style>
</head>
<body>
<div id="map-loading">加载边表与场域算法…</div>
<div id="map"></div>
<div class="panel-header">
  <h1>触媒场域 + 资源场域 <span style="color:var(--magenta-bright)">· 打包示例</span></h1>
  <div class="sub">玫红双圆 = 触媒 DBSCAN；青色双圆 = 资源域 DBSCAN。CSV 默认 <code>../../data/cld_priority.csv</code>；可设 <code>window.PRB_FIELD_CSV_URL</code>。</div>
</div>
<script>
const map = L.map('map', {
  center: [31.195, 121.438],
  zoom: 15,
  zoomControl: false,
  attributionControl: false,
  preferCanvas: true,
  zoomAnimation: false,
  fadeAnimation: false
});
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  maxZoom: 19,
  subdomains: 'abcd',
  updateWhenIdle: true,
  keepBuffer: 1
}).addTo(map);
L.control.zoom({ position: 'bottomright' }).addTo(map);

const boundaryLayerGroup = L.layerGroup().addTo(map);
function bringStudyBoundaryToFront() {
  boundaryLayerGroup.eachLayer(function (ly) {
    if (ly && typeof ly.bringToFront === 'function') ly.bringToFront();
  });
}
addXujiahuiBoundaryToGroup(boundaryLayerGroup, bringStudyBoundaryToFront);

const mapLoadingEl = document.getElementById('map-loading');
function hideMapLoading() {
  if (mapLoadingEl) mapLoadingEl.classList.add('done');
}

PRB_FieldSystemData.loadEdges().then(async (edgesAll) => {
  let edges = edgesAll;
  if (typeof filterEdgeRecordsToDaxujiahuiStudy === 'function') {
    edges = await filterEdgeRecordsToDaxujiahuiStudy(edgesAll);
  }
  setTimeout(() => {
    let classified, fields;
    try {
      classified = classifyNodes(edges);
      fields = selectFieldSystems(edges, classified);
    } catch (err) {
      console.error(err);
      hideMapLoading();
      return;
    }
    let resourceFields;
    try {
      resourceFields = selectResourceFieldSystems(edges);
    } catch (err) {
      console.error(err);
      resourceFields = { fieldSystems: [] };
    }
    setTimeout(() => {
      try {
        PRB_FieldSystemLeaflet.renderFieldSystemMap(
          map,
          edges,
          classified,
          fields,
          resourceFields,
          () => requestAnimationFrame(hideMapLoading)
        );
      } catch (err) {
        console.error(err);
        hideMapLoading();
      }
    }, 0);
  }, 0);
});
</script>
</body>
</html>
