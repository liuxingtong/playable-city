<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PRB · 潜力与资源节点地图</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="../lib/ac-dom-aggregate.js"></script>
<script src="../lib/xujiahui-osm-boundary.js"></script>
<script src="../modules/jenks-classification.js"></script>
<script src="../modules/map-intervention-data.js"></script>
<script src="../modules/map-intervention-leaflet.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500&family=Noto+Sans+SC:wght@400;500&display=swap');
  :root { --magenta: #e91e8c; --magenta-bright: #ff4dad; --magenta-dim: rgba(233,30,140,0.45); }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;font-family:'DM Sans','Noto Sans SC',sans-serif}
  #map{width:100%;height:100%;z-index:1}
  .leaflet-control-attribution{display:none!important}
  .panel-header{position:fixed;top:0;left:0;right:0;padding:18px 24px;background:linear-gradient(180deg,rgba(8,8,10,0.92),transparent);z-index:1000;pointer-events:none}
  .panel-header h1{font-size:20px;color:#f0f0f0;font-weight:700}
  .panel-header .sub{font-size:11px;color:rgba(255,255,255,0.38);margin-top:4px}
  .layer-ctrl{position:fixed;top:88px;right:22px;background:rgba(12,12,14,0.94);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:12px 14px;z-index:1000;width:200px;font-size:11px;color:rgba(255,255,255,0.75)}
  .lc-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;cursor:pointer}
  .lc-check{width:10px;height:10px;border-radius:2px;border:1px solid rgba(255,255,255,0.25)}
  .lc-check.on{background:var(--magenta-bright);border-color:var(--magenta-bright)}
  .stats-panel{position:fixed;bottom:22px;left:22px;background:rgba(12,12,14,0.94);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:12px 14px;z-index:1000;font-size:11px;color:rgba(255,255,255,0.55)}
  .node-tooltip{background:rgba(12,12,14,0.95)!important;border:1px solid rgba(233,30,140,0.35)!important;color:#eee!important;border-radius:8px!important;padding:8px 10px!important;font-size:11px!important}
  .tt-type{font-size:9px;letter-spacing:1px;text-transform:uppercase;opacity:0.5;margin-bottom:4px}
  .tt-name{font-weight:600;margin-bottom:6px}
  .tt-r{display:flex;justify-content:space-between;gap:12px;margin-top:2px;font-size:10px}
</style>
</head>
<body>
<div id="map"></div>
<div class="panel-header">
  <h1>潜力与资源节点 <span style="color:var(--magenta-bright)">· 打包示例</span></h1>
  <div class="sub">数据默认 <code>../../data/cld_priority.csv</code>；可设 <code>window.PRB_MAP_CSV_URL</code></div>
</div>
<div class="layer-ctrl">
  <div class="lc-row" onclick="toggleLayer('activated')"><div class="lc-check on" id="chk-activated"></div>潜力层</div>
  <div class="lc-row" onclick="toggleLayer('resource')"><div class="lc-check on" id="chk-resource"></div>资源层</div>
  <div class="lc-row" onclick="toggleLayer('network')"><div class="lc-check on" id="chk-network"></div>底图路网</div>
  <div class="lc-row" onclick="toggleLayer('boundary')"><div class="lc-check on" id="chk-boundary"></div>研究区边界</div>
</div>
<div class="stats-panel" id="stats-panel">加载中…</div>
<script>
const map = L.map('map', {
  center: [31.195, 121.438],
  zoom: 15,
  zoomControl: false,
  attributionControl: false,
  preferCanvas: true
});
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  maxZoom: 19,
  subdomains: 'abcd',
  updateWhenIdle: true
}).addTo(map);
L.control.zoom({ position: 'bottomright' }).addTo(map);

PRB_MapInterventionData.loadEdgesMapIntervention().then(async (edges) => {
  let e = edges;
  if (typeof filterEdgeRecordsToDaxujiahuiStudy === 'function') {
    e = await filterEdgeRecordsToDaxujiahuiStudy(e);
  }
  const pack = await PRB_MapInterventionData.computeMapInterventionLayers(e);
  const ui = PRB_MapInterventionLeaflet.mountMapInterventionVisual(map, pack);
  const st = ui.stats;
  const el = document.getElementById('stats-panel');
  if (el) {
    el.textContent = `界内路网 ${st.nNetInStudy} · 潜力标点 ${st.nAct}/${st.nActAll} · 资源标点 ${st.nRes}/${st.nResAll}`;
  }
});
</script>
</body>
</html>
